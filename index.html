<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ann Maria & Joel — 12 December 2026</title>
<meta name="description" content="Wedding of Ann Maria and Joel. Saturday 12 December 2026, Changanacherry, Kerala. Programme and venues.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   Tokens
   ───────────────────────────────────────────── */
:root{
  --ink:      #05161a;   /* wet slate, near-black teal        */
  --deep:     #0a2a2e;   /* backwater at dusk                 */
  --slate:    #12393d;   /* raised surfaces                   */
  --jasmine:  #f4efe4;   /* warm white — primary text         */
  --brass:    #d9a441;   /* lamp glow — accent                */
  --blush:    #e5a6a0;   /* petal                             */
  --muted:    rgba(244,239,228,.60);
  --hair:     rgba(217,164,65,.28);

  --display: "Bodoni Moda", "Didot", Georgia, serif;
  --sans:    "Jost", "Avenir Next", system-ui, sans-serif;

  --pad: clamp(1.25rem, 5vw, 4rem);
  --band: clamp(4.5rem, 11vw, 9rem);
}

*{box-sizing:border-box}
/* text people may actually want to copy */
address, .verse p, .slot-body p{
  -webkit-user-select:text; user-select:text;
}
html{scroll-behavior:smooth}
body{
  margin:0;
  /* no double-tap zoom, and no text selection or callout when holding to blow
     bubbles — pinch zoom and normal scrolling still work */
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  background:var(--ink);
  color:var(--jasmine);
  font-family:var(--sans);
  font-weight:300;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{ /* ambient depth behind the rain */
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60vw 50vh at 78% 8%,  rgba(217,164,65,.16), transparent 62%),
    radial-gradient(50vw 45vh at 12% 32%, rgba(46,124,110,.20), transparent 66%),
    radial-gradient(70vw 60vh at 50% 108%,rgba(229,166,160,.10), transparent 60%);
}
#rain{position:fixed; inset:0; z-index:1; pointer-events:none}
#burst{position:fixed; inset:0; z-index:60; pointer-events:none}
.page{position:relative; z-index:2}

/* ─────────────────────────────────────────────
   Type
   ───────────────────────────────────────────── */
h1,h2,h3{font-family:var(--display); font-weight:400; margin:0; line-height:1.02}
.eyebrow{
  font-size:.7rem; letter-spacing:.34em; text-transform:uppercase;
  color:var(--brass); font-weight:400; margin:0 0 1.4rem;
}
.lede{font-size:clamp(1rem,1.7vw,1.15rem); color:var(--muted); max-width:46ch}
.figure{font-family:var(--display); font-style:italic}

/* ─────────────────────────────────────────────
   Nav
   ───────────────────────────────────────────── */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:1rem var(--pad);
  background:linear-gradient(rgba(5,22,26,.86), rgba(5,22,26,0));
  backdrop-filter:blur(3px);
}
.mono{font-family:var(--display); font-style:italic; font-size:1.15rem; letter-spacing:.02em}
/* a pin that opens out into a label on hover */
.maplink{
  display:inline-flex; align-items:center; justify-content:center;
  height:42px; min-width:42px; padding:0 12px; border-radius:99px;
  border:1px solid var(--hair); background:rgba(5,22,26,.55);
  color:var(--muted); text-decoration:none;
  font-size:.7rem; letter-spacing:.18em; text-transform:uppercase;
  white-space:nowrap;
  transition:color .3s, border-color .3s, background .3s;
}
.maplink svg{
  width:19px; height:19px; flex:none;
  fill:none; stroke:var(--brass); stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round;
  transition:transform .45s cubic-bezier(.2,.9,.3,1.5);
}
.maplink span{
  display:block; max-width:0; margin-left:0; opacity:0; overflow:hidden;
  transition:max-width .45s cubic-bezier(.2,.8,.3,1), margin-left .45s, opacity .3s;
}
.maplink:hover, .maplink:focus-visible{
  color:var(--jasmine); border-color:var(--brass); background:rgba(217,164,65,.1);
}
.maplink:hover svg, .maplink:focus-visible svg{transform:translateY(-1.5px)}
.maplink:hover span, .maplink:focus-visible span{
  max-width:12rem; margin-left:.55rem; margin-right:.1rem; opacity:1;
}

/* ─────────────────────────────────────────────
   Hero — the rain window
   ───────────────────────────────────────────── */
.hero{
  position:relative; min-height:100svh;
  display:grid; place-items:center; text-align:center;
  padding:7rem var(--pad) 4rem;
  isolation:isolate;
}
#glass{position:absolute; inset:0; z-index:-1; pointer-events:none}
.hero-inner{max-width:60rem}
.names{
  font-size:clamp(3.4rem, 15vw, 11rem);
  font-style:italic; letter-spacing:-.015em;
  margin:0; text-wrap:balance;
}
.names .amp{
  display:block; font-style:normal; color:var(--brass);
  font-size:.3em; letter-spacing:.1em; margin:.15em 0;
}
.hero .rule{
  width:1px; height:clamp(2.5rem,7vw,4.5rem); margin:2.2rem auto 1.6rem;
  background:linear-gradient(var(--brass), transparent);
}
.when{font-size:clamp(.82rem,2.4vw,1rem); letter-spacing:.32em; text-transform:uppercase}
.where{color:var(--muted); letter-spacing:.16em; font-size:.82rem; text-transform:uppercase; margin-top:.6rem}

.count{display:flex; gap:clamp(1.2rem,5vw,3rem); justify-content:center; margin-top:3rem}
.count div{min-width:3.2rem}
.count b{
  display:block; font-family:var(--display); font-weight:400;
  font-size:clamp(1.7rem,5vw,2.6rem); font-variant-numeric:tabular-nums;
}
.count span{font-size:.6rem; letter-spacing:.26em; text-transform:uppercase; color:var(--muted)}

.hint{
  margin-top:3.4rem; font-size:.7rem; letter-spacing:.24em; text-transform:uppercase;
  color:rgba(244,239,228,.42); animation:breathe 3.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.85}}

/* Bar chimes, hanging under the names — kept under 3cm tall */
.chimes{display:flex; justify-content:center; margin:clamp(1.2rem,3.5vw,2rem) auto clamp(.9rem,2.2vw,1.5rem)}
.chimes svg{height:clamp(62px, 13vh, 112px); width:auto; max-width:100%; overflow:visible; display:block}
.bar{fill:url(#barGrad); stroke:var(--hair); stroke-width:1}
.bar-hole{fill:rgba(5,22,26,.9); stroke:rgba(217,164,65,.35); stroke-width:.8}
.string{stroke:rgba(217,164,65,.55); stroke-width:.8; fill:none}
.loop{fill:none; stroke:rgba(244,239,228,.5); stroke-width:.8}
.tube{cursor:pointer; transform-box:fill-box; transform-origin:50% 0%}
.tube .pipe{fill:url(#tubeGrad); stroke:rgba(244,239,228,.22); stroke-width:.5; transition:stroke .3s}
.tube .sheen{stroke:rgba(255,255,255,.45); stroke-width:.7; stroke-linecap:round}
.tube .hit{fill:transparent}
@media (hover:hover){ .tube:hover .pipe{stroke:var(--brass)} }
.tube{will-change:transform}
.key{cursor:pointer}
.bar-key .face{
  stroke:rgba(0,0,0,.28); stroke-width:.5;
  transform-box:fill-box; transform-origin:50% 50%;
}
.xylophone .face{fill:url(#woodX)}
.marimba   .face{fill:url(#woodM)}
.pin{fill:rgba(5,22,26,.5)}
.fascia{fill:var(--brass); opacity:.75}
.nat .face{fill:url(#ivory); stroke:rgba(5,22,26,.55); stroke-width:.7}
.acc .face{fill:url(#ebony); stroke:rgba(217,164,65,.45); stroke-width:.7}
.nat .face, .acc .face{transform-box:fill-box; transform-origin:50% 0%}
@media (hover:hover){
  .nat:hover .face{fill:#fffdf6}
  .acc:hover .face{stroke:var(--brass)}
}
.nat.struck .face{animation:pressN .4s ease-out}
.acc.struck .face{animation:pressA .4s ease-out}
@keyframes pressN{
  0%  {transform:translateY(3px) scaleY(.985); filter:brightness(.8)}
  100%{transform:translateY(0) scaleY(1);      filter:brightness(1)}
}
@keyframes pressA{
  0%  {transform:translateY(2.5px) scaleY(.98); filter:brightness(2.4)}
  100%{transform:translateY(0) scaleY(1);       filter:brightness(1)}
}
.reso{fill:url(#tubeGrad); opacity:.8}
.rail{stroke:var(--hair); stroke-width:1.4; fill:none}
@media (hover:hover){ .bar-key:hover .face{stroke:var(--brass); stroke-width:1} }
.key.struck .face{animation:strike .5s ease-out}
@keyframes strike{
  0%  {transform:translateY(0);   filter:brightness(2.1)}
  22% {transform:translateY(2.6px); filter:brightness(1.3)}
  100%{transform:translateY(0);   filter:brightness(1)}
}

/* instrument picker */
.seg{display:flex; flex-wrap:wrap; gap:.25rem}
.seg-b{
  flex:1 1 44%; cursor:pointer; padding:.5rem .15rem;
  border:1px solid var(--hair); border-radius:2px; background:transparent;
  color:var(--muted); font-family:var(--sans);
  font-size:.53rem; letter-spacing:.1em; text-transform:uppercase;
  transition:color .3s, border-color .3s, background .3s;
}
.seg-b:hover{color:var(--jasmine)}
.seg-b.on{background:rgba(217,164,65,.18); color:var(--jasmine); border-color:var(--brass)}

/* ─────────────────────────────────────────────
   Bands
   ───────────────────────────────────────────── */
.band{padding:var(--band) var(--pad); max-width:74rem; margin-inline:auto}
.band-head{margin-bottom:clamp(2.5rem,6vw,4.5rem)}
.band-head h2{font-size:clamp(2.1rem,6vw,3.6rem); font-style:italic}

.verse{text-align:center; max-width:38rem; margin-inline:auto}
.verse p{font-family:var(--display); font-style:italic; font-size:clamp(1.35rem,4vw,2rem); line-height:1.45; margin:0}
.verse cite{display:block; margin-top:1.6rem; font-family:var(--sans); font-style:normal;
  font-size:.68rem; letter-spacing:.28em; text-transform:uppercase; color:var(--brass)}

/* Programme — the rainline */
.day{margin-bottom:clamp(3rem,7vw,5rem)}
.day-label{
  display:flex; align-items:baseline; gap:1rem; margin-bottom:2.2rem;
  border-bottom:1px solid var(--hair); padding-bottom:.9rem;
}
.day-label h3{font-size:clamp(1.3rem,3.4vw,1.8rem); font-style:italic}
.day-label span{font-size:.68rem; letter-spacing:.24em; text-transform:uppercase; color:var(--muted)}

.slot{
  display:grid; grid-template-columns:7.5rem 2.5rem 1fr; align-items:start;
  gap:0; position:relative; padding-bottom:2.6rem;
}
.slot-time{
  text-align:right; padding-right:1.2rem; padding-top:.1rem;
  font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--brass);
  font-variant-numeric:tabular-nums;
}
.slot-line{position:relative; justify-self:center; width:2.5rem; align-self:stretch}
.slot-line::before{ /* the falling rainline */
  content:""; position:absolute; left:50%; top:.45rem; bottom:-.3rem; width:1px;
  transform:translateX(-.5px) scaleY(var(--grow,0)); transform-origin:top;
  background:linear-gradient(rgba(217,164,65,.55), rgba(217,164,65,.08));
  transition:transform 1s cubic-bezier(.4,0,.2,1) .15s;
}
.slot:last-child .slot-line::before{display:none}
.drop{
  position:absolute; left:50%; top:.15rem; width:11px; height:14px;
  transform:translateX(-50%) scale(0);
  background:var(--brass);
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
  clip-path:path("M5.5 0 C5.5 0 11 7 11 9.4 A5.5 5.5 0 0 1 0 9.4 C0 7 5.5 0 5.5 0 Z");
  transition:transform .6s cubic-bezier(.2,1.5,.4,1);
  box-shadow:0 0 12px rgba(217,164,65,.55);
}
.drop::after{ /* ripple on arrival */
  content:""; position:absolute; left:50%; top:60%; width:34px; height:34px; margin:-17px 0 0 -17px;
  border:1px solid rgba(217,164,65,.5); border-radius:50%; opacity:0;
}
.slot.in .drop{transform:translateX(-50%) scale(1)}
.slot.in .drop::after{animation:ripple 1.4s ease-out .35s}
.slot.in .slot-line::before{--grow:1}
@keyframes ripple{0%{transform:scale(.2); opacity:.9}100%{transform:scale(1.6); opacity:0}}

.slot-body{padding-left:1.2rem; opacity:0; transform:translateY(14px); transition:all .8s ease .25s}
.slot.in .slot-body{opacity:1; transform:none}
.slot-body h4{
  margin:0 0 .35rem; font-family:var(--display); font-weight:400;
  font-size:clamp(1.15rem,3vw,1.5rem);
}
.slot-body p{margin:0; color:var(--muted); font-size:.95rem; max-width:44ch}
.slot-body .venue{
  display:inline-block; margin-top:.5rem; font-size:.68rem; letter-spacing:.2em;
  text-transform:uppercase; color:rgba(244,239,228,.45);
}
@media (max-width:640px){
  .slot{grid-template-columns:4.4rem 1.8rem 1fr}
  .slot-time{font-size:.68rem; padding-right:.7rem}
  .slot-body{padding-left:.8rem}
}

/* Venues */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(19rem,1fr)); gap:1.25rem}
.card{
  border:1px solid var(--hair); border-radius:2px; padding:2.2rem 1.9rem;
  background:linear-gradient(160deg, rgba(18,57,61,.55), rgba(10,42,46,.25));
  transition:transform .5s cubic-bezier(.2,.8,.3,1), border-color .5s, background .5s;
}
.card:hover{transform:translateY(-6px); border-color:rgba(217,164,65,.6)}
.card .tag{font-size:.66rem; letter-spacing:.26em; text-transform:uppercase; color:var(--brass)}
.card h3{margin:1rem 0 .5rem; font-size:1.5rem}
.card address{font-style:normal; color:var(--muted); font-size:.92rem}
.card a{
  display:inline-block; margin-top:1.3rem; color:var(--jasmine); text-decoration:none;
  font-size:.7rem; letter-spacing:.22em; text-transform:uppercase;
  border-bottom:1px solid var(--brass); padding-bottom:.3rem;
}
.card a:hover{color:var(--brass)}

/* Notes */
.notes{display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:2.5rem 2rem}
.note h4{margin:0 0 .6rem; font-family:var(--display); font-weight:400; font-size:1.25rem}
.note p{margin:0; color:var(--muted); font-size:.93rem}
.note .num{
  display:block; font-size:.66rem; letter-spacing:.26em; color:var(--brass); margin-bottom:.9rem;
}

/* Footer */
.foot{text-align:center; padding:var(--band) var(--pad) 8rem; border-top:1px solid var(--hair)}
.foot p{font-family:var(--display); font-style:italic; font-size:clamp(1.4rem,4vw,2.2rem); margin:0 0 1.2rem}
.foot small{font-size:.66rem; letter-spacing:.26em; text-transform:uppercase; color:var(--muted)}

/* Rain switch */
/* Settings menu, top left */
.brand{display:flex; align-items:center; gap:.85rem}
.cog{
  width:42px; height:42px; display:grid; place-items:center; cursor:pointer;
  border:1px solid var(--hair); border-radius:50%;
  background:rgba(5,22,26,.55); color:var(--muted);
  transition:color .3s, border-color .3s;
}
.cog:hover, .cog[aria-expanded="true"]{color:var(--jasmine); border-color:var(--brass)}
.cog svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round}
.settings{
  position:absolute; left:var(--pad); top:calc(100% - .15rem);
  display:flex; flex-direction:column; gap:.45rem;
  min-width:14rem; padding:.95rem 1rem 1rem;
  border:1px solid var(--hair); border-radius:3px;
  background:rgba(5,22,26,.96);
  box-shadow:0 20px 45px -25px rgba(0,0,0,.9);
  animation:setdrop .28s cubic-bezier(.2,.8,.3,1);
}
.settings[hidden]{display:none}
@keyframes setdrop{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
.set-title{
  margin:0 0 .35rem; font-size:.58rem; letter-spacing:.26em;
  text-transform:uppercase; color:var(--brass);
}
.switch{
  display:flex; align-items:center; justify-content:space-between; gap:1.2rem;
  width:100%; cursor:pointer;
  padding:.55rem .7rem; border-radius:2px;
  background:transparent; border:1px solid transparent;
  color:var(--muted); font-family:var(--sans);
  font-size:.62rem; letter-spacing:.2em; text-transform:uppercase;
  transition:color .3s, border-color .3s, background .3s;
}
.switch:hover{color:var(--jasmine); border-color:var(--hair); background:rgba(217,164,65,.06)}
.switch i{
  width:26px; height:8px; border-radius:99px; flex:none;
  background:var(--brass); position:relative; transition:background .3s;
}
.switch i::after{
  content:""; position:absolute; top:-3px; right:-2px;
  width:14px; height:14px; border-radius:50%;
  background:var(--jasmine); transition:transform .3s cubic-bezier(.2,.9,.3,1.4);
}
.switch.off i{background:rgba(244,239,228,.18)}
.switch.off i::after{transform:translateX(-12px); background:var(--muted)}

/* ─────────────────────────────────────────────
   Scroll progress — the wedding cycle
   ───────────────────────────────────────────── */
.progress{
  position:fixed; left:0; right:0; bottom:0; height:88px; z-index:65; pointer-events:none;
}
.progress::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(rgba(5,22,26,0), rgba(5,22,26,.55) 45%, rgba(5,22,26,.9));
}
.road{
  position:absolute; left:0; right:0; bottom:28px; height:1px;
  background:rgba(244,239,228,.13);
}
.road-done{
  position:absolute; left:0; top:0; height:100%; width:0;
  background:linear-gradient(90deg, rgba(217,164,65,.08), rgba(217,164,65,.9));
}
.rider{
  position:absolute; left:0; bottom:24px; width:104px; height:72px;
  will-change:transform;
}
.rider svg{width:100%; height:100%; overflow:visible; display:block}

.tyre{fill:none; stroke:var(--brass); stroke-width:1.6}
.spokes line{stroke:rgba(217,164,65,.42); stroke-width:.9}
.frame{fill:none; stroke:var(--brass); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
.thin{fill:none; stroke:var(--brass); stroke-width:1.1; stroke-linecap:round}
.limb{fill:none; stroke:var(--jasmine); stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round}
.skull{fill:var(--jasmine)}
.sari{fill:none; stroke:var(--blush); stroke-width:1.5; stroke-linecap:round}
.far{opacity:.4}

@keyframes sariwave{from{transform:rotate(-5deg) scaleY(.92)} to{transform:rotate(6deg) scaleY(1.08)}}
@keyframes legsway{from{transform:rotate(-7deg)} to{transform:rotate(8deg)}}
#sari{transform-box:view-box; transform-origin:18px 28px; animation:sariwave .8s ease-in-out infinite alternate}
#brideLegs{transform-box:view-box; transform-origin:21px 42px; animation:legsway 1.05s ease-in-out infinite alternate}
.rider.idle #sari, .rider.idle #brideLegs{animation-play-state:paused}

@media (max-width:640px){
  .progress{height:74px}
  .rider{width:80px; height:55px; bottom:22px}
  .road{bottom:26px}
}

/* ─────────────────────────────────────────────
   The welcome gate — what a scanned QR code lands on
   ───────────────────────────────────────────── */
.gate{
  position:fixed; inset:0; z-index:200;
  display:grid; place-items:center; padding:1.5rem;
  background:var(--ink);
  animation:gatein .5s ease both;
}
.gate[hidden]{display:none}
.gate.out{animation:gateout .55s cubic-bezier(.4,0,.2,1) both}
@keyframes gatein{from{opacity:0} to{opacity:1}}
@keyframes gateout{from{opacity:1} to{opacity:0; visibility:hidden}}
.gate::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(60vw 50vh at 78% 8%,  rgba(217,164,65,.16), transparent 62%),
    radial-gradient(50vw 45vh at 12% 32%, rgba(46,124,110,.20), transparent 66%),
    radial-gradient(70vw 60vh at 50% 108%,rgba(229,166,160,.10), transparent 60%);
}
.gate-card{
  position:relative; width:min(30rem,100%); text-align:center;
  padding:clamp(2rem,7vw,3rem) clamp(1.4rem,6vw,2.6rem);
  border:1px solid var(--hair); border-radius:3px;
  background:linear-gradient(160deg, rgba(18,57,61,.55), rgba(5,22,26,.5));
  box-shadow:0 30px 70px -40px #000;
  animation:gaterise .9s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes gaterise{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
.gate-names{
  margin:0; font-family:var(--display); font-weight:400; font-style:italic;
  font-size:clamp(2.2rem,10vw,3.4rem); line-height:1.05; letter-spacing:-.01em;
}
.gate-names .amp{
  display:block; font-style:normal; color:var(--brass);
  font-size:.3em; letter-spacing:.1em; margin:.2em 0;
}
.gate-date{margin:1.5rem 0 0; font-size:.72rem; letter-spacing:.26em; text-transform:uppercase}
.gate-rule{width:1px; height:2.4rem; margin:1.6rem auto; background:linear-gradient(var(--brass), transparent)}
.gate-venue{margin:0; font-family:var(--display); font-size:1.3rem; font-style:italic}
.gate-area{margin:.35rem 0 0; color:var(--muted); font-size:.82rem; letter-spacing:.1em}
.gate-timer{position:relative; width:96px; height:96px; margin:1.9rem auto .4rem}
.gate-timer > svg{width:100%; height:100%; transform:rotate(-90deg)}
.trk{fill:none; stroke:rgba(244,239,228,.14); stroke-width:2}
.arc{fill:none; stroke:var(--brass); stroke-width:2; stroke-linecap:round;
     stroke-dasharray:289.03; stroke-dashoffset:289.03}
.gate-pin{position:absolute; inset:0; display:grid; place-items:center}
.gate-pin svg{
  width:30px; height:30px; fill:none; stroke:var(--brass); stroke-width:1.5;
  stroke-linecap:round; stroke-linejoin:round;
  animation:gatehover 2.4s ease-in-out infinite;
}
@keyframes gatehover{0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)}}
.gate-status{
  margin:.5rem 0 0; min-height:1.4em; font-size:.68rem;
  letter-spacing:.22em; text-transform:uppercase; color:var(--muted);
}
.gate-acts{display:flex; flex-direction:column; gap:.7rem; margin-top:1.9rem}
.btn-gate{
  display:block; width:100%; cursor:pointer; text-decoration:none; text-align:center;
  padding:1rem 1.5rem; border-radius:2px;
  font-family:var(--sans); font-size:.7rem; font-weight:500;
  letter-spacing:.22em; text-transform:uppercase;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s, background .3s, color .3s, border-color .3s;
}
.btn-gate.solid{background:var(--brass); color:var(--ink); border:1px solid var(--brass)}
.btn-gate.solid:hover{transform:translateY(-2px); box-shadow:0 12px 30px -14px rgba(217,164,65,.9)}
.btn-gate.ghost{background:transparent; color:var(--muted); border:1px solid var(--hair)}
.btn-gate.ghost:hover{color:var(--jasmine); border-color:var(--brass); background:rgba(217,164,65,.08)}
.gate-x{
  position:absolute; top:.6rem; right:.6rem;
  width:34px; height:34px; display:grid; place-items:center; cursor:pointer;
  border:0; border-radius:50%; background:transparent; color:var(--muted);
  font-size:1.2rem; line-height:1; transition:color .3s, background .3s;
}
.gate-x:hover{color:var(--jasmine); background:rgba(244,239,228,.07)}
body.gated{overflow:hidden}

/* ─────────────────────────────────────────────
   Note pad — F major pentatonic, so nothing lands wrong
   ───────────────────────────────────────────── */
.clips{position:absolute; width:0; height:0; overflow:hidden}
.notepad{
  /* every row is six cells wide, so the block is a clean rectangle */
  --hex:clamp(40px, calc((min(100vw, 62rem) - 2 * var(--pad)) / 6.1), 118px);
  width:100%;
  display:flex; flex-direction:column; align-items:center;
  margin-top:clamp(2rem,5vw,3.5rem);
}
.krow{display:flex}
.krow + .krow{margin-top:calc(var(--hex) * -.2887)}   /* rows interlock, no gaps */
.krow.o1{--tint:.11}
.krow.o2{--tint:.16}
.krow.o3{--tint:.21}
.krow.o4{--tint:.26}
.krow.o5{--tint:.31}
.cell{
  position:relative;
  height:calc(var(--hex) * 1.1547);
  border:0; padding:0; cursor:pointer;
  color:var(--jasmine);
  font-family:var(--sans); font-weight:400;
  font-size:calc(var(--hex) * .19); letter-spacing:.06em;
  display:grid; place-items:center; touch-action:none;
  /* the darker rim is what separates one cell from the next without a gap */
  background:radial-gradient(circle calc(var(--hex) * .56) at var(--cx,50%) 46%,
    rgba(217,164,65,var(--tint)) 34%,
    rgba(217,164,65,calc(var(--tint) * .35)) 68%,
    rgba(5,22,26,.72) 100%);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.5);
}
/* rounded joins, so the corners read soft rather than cut */
.hex{width:var(--hex); clip-path:url(#hexFull)}
.half{width:calc(var(--hex) * .5); font-size:calc(var(--hex) * .15)}
.half.l{--cx:0%;   clip-path:url(#hexCapL); text-indent:calc(var(--hex) * -.1)}
.half.r{--cx:100%; clip-path:url(#hexCapR); text-indent:calc(var(--hex) * .1)}
.cell span{position:relative; z-index:1}
.cell::after{
  content:""; position:absolute; inset:0;
  background:var(--brass); opacity:0;
}
@media (hover:hover){ .cell:hover{transform:scale(1.05)} }
.cell.lit{z-index:2}
.cell.lit::after{animation:hexlit .6s ease-out}
@keyframes hexlit{0%{opacity:.92} 100%{opacity:0}}

/* Backdrop blur is cheap on a Mac and expensive on tablets/phones, where it
   forces the whole page to recomposite over the animating canvases. */
@media (hover: none){
  .topbar{backdrop-filter:none; background:linear-gradient(rgba(5,22,26,.94), rgba(5,22,26,0))}
  .switch{backdrop-filter:none; background:rgba(5,22,26,.9)}
}

/* Reveal */
.reveal{opacity:0; transform:translateY(22px); transition:opacity 1s ease, transform 1s cubic-bezier(.2,.8,.3,1)}
.reveal.in{opacity:1; transform:none}

:focus-visible{outline:2px solid var(--brass); outline-offset:4px}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important; transition:none !important}
  .reveal,.slot-body{opacity:1; transform:none}
  .drop{transform:translateX(-50%) scale(1)}
  .slot-line::before{--grow:1}
}
</style>
